name: Generate catalog clients

# Triggered by igvf-catalog (.github/workflows/trigger-clients.yml):
#   catalog-dev      push to igvf-catalog@dev   -> spec + clients on the dev branches
#   catalog-release  igvf-catalog release       -> spec + clients on main, GitHub releases,
#                                                  PyPI (via the client repos), MCP release
# workflow_dispatch runs either channel by hand; dry_run (default) skips every push/release.

on:
  repository_dispatch:
    types: [catalog-dev, catalog-release]
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [dev, release]
        required: true
      ref:
        description: igvf-catalog git ref (sha, branch or tag)
        required: true
      tag:
        description: igvf-catalog release tag (release channel only)
        required: false
      dry_run:
        description: Generate and test, but push and release nothing
        type: boolean
        default: true
      force:
        description: Regenerate clients even if the spec is unchanged (dev channel)
        type: boolean
        default: false

concurrency:
  group: generate-${{ (github.event.action == 'catalog-release' || inputs.channel == 'release') && 'release' || 'dev' }}
  cancel-in-progress: ${{ !(github.event.action == 'catalog-release' || inputs.channel == 'release') }}

env:
  CHANNEL: ${{ github.event_name == 'repository_dispatch' && (github.event.action == 'catalog-release' && 'release' || 'dev') || inputs.channel }}
  CATALOG_REF: ${{ github.event.client_payload.ref || inputs.ref }}
  RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run || false }}
  FORCE: ${{ inputs.force || false }}
  DEV_HOST: catalog-api-dev.demo.igvf.org
  PROD_HOST: api.catalogkg.igvf.org

jobs:
  spec:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      r_version: ${{ steps.version.outputs.r_version }}
      branch: ${{ steps.channel.outputs.branch }}
      changed: ${{ steps.changed.outputs.changed }}
      catalog_sha: ${{ steps.catalog.outputs.sha }}
    steps:
      - name: Resolve channel
        id: channel
        run: |
          case "$CHANNEL" in
            dev)     branch=dev;  host=$DEV_HOST ;;
            release) branch=main; host=$PROD_HOST
                     if [ -z "$RELEASE_TAG" ]; then
                       echo "::error::the release channel needs a release tag"; exit 1
                     fi ;;
            *)       echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
          esac
          if [ -z "$CATALOG_REF" ]; then echo "::error::no igvf-catalog ref given"; exit 1; fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL ref=$CATALOG_REF tag=$RELEASE_TAG dry_run=$DRY_RUN force=$FORCE"

      # Scripts and configs always come from the commit this workflow runs from.
      - uses: actions/checkout@v4
        with:
          path: tools

      - uses: actions/checkout@v4
        with:
          repository: IGVF-DACC/igvf-catalog
          ref: ${{ env.CATALOG_REF }}
          path: catalog

      - name: Check igvf-catalog ref
        id: catalog
        working-directory: catalog
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ ! -f src/scripts/generateOpenapi.ts ]; then
            echo "::error::igvf-catalog@$CATALOG_REF has no src/scripts/generateOpenapi.ts; refs older than PR #926 can't be generated"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: catalog/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dump OpenAPI spec from igvf-catalog
        working-directory: catalog
        env:
          HOST: ${{ steps.channel.outputs.host }}
        run: |
          npm ci --no-audit --no-fund
          ENV=production IGVF_CATALOG_OPEN_API_CONFIG_TYPE=production \
          IGVF_CATALOG_PROTOCOL=https IGVF_CATALOG_HOSTNAME="$HOST" \
            npx tsx src/scripts/generateOpenapi.ts ../build/openapi_spec.json

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = release ]; then
            python tools/scripts/compute_version.py --channel release --tag "$RELEASE_TAG" | tee -a "$GITHUB_OUTPUT"
          else
            gh api "repos/IGVF-DACC/igvf-catalog/releases?per_page=100" > build/releases.json
            python tools/scripts/compute_version.py --channel dev \
              --releases-json build/releases.json --timestamp "$(date -u +%Y%m%d%H%M%S)" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Check the release doesn't exist yet
        if: env.CHANNEL == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail=0
          for repo in igvf-catalog-client-openapi-spec igvf-catalog-python-client \
                      igvf-catalog-async-python-client igvf-catalog-r-client igvf-catalog-mcp; do
            if gh api "repos/IGVF-DACC/$repo/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
              echo "::error::IGVF-DACC/$repo already has tag v$VERSION; refusing to overwrite it"
              fail=1
            fi
          done
          exit $fail

      - name: Process spec
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOST: ${{ steps.channel.outputs.host }}
        run: |
          python tools/scripts/remove_endpoints.py --input build/openapi_spec.json
          python tools/scripts/preprocess_spec.py --input build/openapi_spec.json --output build/openapi_spec_processed.json
          python tools/scripts/set_spec_version.py build/openapi_spec.json build/openapi_spec_processed.json \
            --version "$VERSION" --expect-host "$HOST"

      - name: Detect spec changes
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          if [ "$CHANNEL" = release ] || [ "$FORCE" = true ]; then
            changed=true
          else
            # The spec committed on the branch by the last successful run (missing -> changed)
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/IGVF-DACC/igvf-catalog-client-openapi-spec/contents/openapi_spec_processed.json?ref=$BRANCH" \
              > build/previous_spec_processed.json 2>/dev/null || rm -f build/previous_spec_processed.json
            changed=$(python tools/scripts/spec_changed.py build/previous_spec_processed.json build/openapi_spec_processed.json)
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Spec changed: $changed"

      - uses: actions/upload-artifact@v4
        with:
          name: spec
          path: |
            build/openapi_spec.json
            build/openapi_spec_processed.json

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          R_VERSION: ${{ steps.version.outputs.r_version }}
          CHANGED: ${{ steps.changed.outputs.changed }}
          SHA: ${{ steps.catalog.outputs.sha }}
        run: |
          {
            echo "### Spec"
            echo "| channel | igvf-catalog | version | R version | changed | dry run |"
            echo "|---|---|---|---|---|---|"
            echo "| $CHANNEL | \`$CATALOG_REF\` ($SHA) | $VERSION | $R_VERSION | $CHANGED | $DRY_RUN |"
          } >> "$GITHUB_STEP_SUMMARY"

  clients:
    needs: spec
    if: needs.spec.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # generator, config and API tag per name live in scripts/generate_client.sh
          - {name: python,       repo: igvf-catalog-python-client,       kind: python, package: igvf_catalog_client,       api: IgvfCatalogApi}
          - {name: python-async, repo: igvf-catalog-async-python-client, kind: python, package: igvf_catalog_async_client, api: AsyncIgvfCatalogApi, asyncio: true}
          - {name: r,            repo: igvf-catalog-r-client,            kind: r}
    name: client (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      REPO: ${{ matrix.repo }}
      BRANCH: ${{ needs.spec.outputs.branch }}
      V: ${{ matrix.kind == 'r' && needs.spec.outputs.r_version || needs.spec.outputs.version }}
      SHA: ${{ needs.spec.outputs.catalog_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - uses: actions/download-artifact@v4
        with:
          name: spec
          path: spec

      - name: Set up builder bot
        id: bot
        if: env.DRY_RUN != 'true'
        uses: ./tools/.github/actions/setup-bot
        with:
          app-id: ${{ vars.CATALOG_CLIENT_BUILDER_APP_ID }}
          private-key: ${{ secrets.CATALOG_CLIENT_BUILDER_PRIVATE_KEY }}
          repositories: ${{ matrix.repo }}

      - name: Clone ${{ matrix.repo }}@${{ needs.spec.outputs.branch }}
        run: |
          git clone "https://github.com/IGVF-DACC/$REPO.git" client
          cd client
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout "$BRANCH"
          else
            echo "origin/$BRANCH doesn't exist yet; creating it from origin/main"
            git checkout -b "$BRANCH" origin/main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate client
        run: |
          npm install -g @openapitools/openapi-generator-cli@2.41.0
          tools/scripts/generate_client.sh ${{ matrix.name }} client spec "$V"

      - uses: actions/setup-python@v5
        if: matrix.kind == 'python'
        with:
          python-version: '3.11'

      - name: Smoke test (python)
        if: matrix.kind == 'python'
        working-directory: client
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/dist" .
          rm -rf build ./*.egg-info
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tools/scripts/smoke_test_python.py" \
            --package ${{ matrix.package }} --api ${{ matrix.api }} --version "$V" \
            ${{ matrix.asyncio && '--asyncio' || '' }}

      # The mcp job tests against this wheel (it's on PyPI only after the release).
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'python-async'
        with:
          name: async-client-wheel
          path: ${{ runner.temp }}/dist/*.whl

      - uses: r-lib/actions/setup-r@v2
        if: matrix.kind == 'r'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.kind == 'r'
        with:
          working-directory: client

      - name: Smoke test (R)
        if: matrix.kind == 'r'
        run: |
          mkdir -p "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r"
          R CMD build "$GITHUB_WORKSPACE/client"
          R CMD check --no-manual --no-tests igvfcatalogclient_*.tar.gz
          R CMD INSTALL igvfcatalogclient_*.tar.gz
          # shellcheck disable=SC2016  # $ below is R, not shell
          Rscript -e 'library(igvfcatalogclient)' \
                  -e 'stopifnot(as.character(packageVersion("igvfcatalogclient")) == Sys.getenv("V"))' \
                  -e 'api <- IgvfCatalogApi$new()' \
                  -e 'stopifnot(is.function(api$Genes), is.function(api$Variants), is.function(api$LlmQuery))'

      - name: Show changes
        working-directory: client
        run: |
          git add -A
          git status --short | head -100
          echo "$(git diff --cached --name-only | wc -l) files changed"

      - name: Commit and push
        if: env.DRY_RUN != 'true'
        working-directory: client
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          if git diff --cached --quiet; then
            echo "No changes on $BRANCH"
          else
            git commit -m "update-$V (igvf-catalog ${SHA:0:8})"
          fi
          git push origin "HEAD:$BRANCH"

      - name: Release
        if: env.DRY_RUN != 'true' && env.CHANNEL == 'release'
        working-directory: client
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh release create "v$V" --repo "IGVF-DACC/$REPO" --target main --title "v$V" \
            --notes "Generated from igvf-catalog $RELEASE_TAG (IGVF-DACC/igvf-catalog@$SHA)"

  # Commits the spec only after every client succeeded, so a failed run is
  # retried (spec still "changed") by the next dev push.
  publish-spec:
    needs: [spec, clients]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - uses: actions/download-artifact@v4
        with:
          name: spec
          path: spec

      - name: Set up builder bot
        id: bot
        if: env.DRY_RUN != 'true'
        uses: ./tools/.github/actions/setup-bot
        with:
          app-id: ${{ vars.CATALOG_CLIENT_BUILDER_APP_ID }}
          private-key: ${{ secrets.CATALOG_CLIENT_BUILDER_PRIVATE_KEY }}
          repositories: igvf-catalog-client-openapi-spec

      - name: Check out ${{ needs.spec.outputs.branch }}
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: ${{ needs.spec.outputs.branch }}
        run: |
          git clone "https://github.com/IGVF-DACC/igvf-catalog-client-openapi-spec.git" target
          cd target
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout "$BRANCH"
          else
            echo "origin/$BRANCH doesn't exist yet; creating it from origin/main"
            git checkout -b "$BRANCH" origin/main
          fi

      - name: Commit spec
        if: env.DRY_RUN != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BRANCH: ${{ needs.spec.outputs.branch }}
          VERSION: ${{ needs.spec.outputs.version }}
          SHA: ${{ needs.spec.outputs.catalog_sha }}
        run: |
          cp ../spec/openapi_spec.json ../spec/openapi_spec_processed.json .
          git add openapi_spec.json openapi_spec_processed.json
          if git diff --cached --quiet; then
            echo "Spec files unchanged on $BRANCH"
          else
            git commit -m "update-$VERSION (igvf-catalog ${SHA:0:8})"
          fi
          git push origin "HEAD:$BRANCH"

      - name: Release spec
        if: env.DRY_RUN != 'true' && env.CHANNEL == 'release'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ needs.spec.outputs.version }}
          SHA: ${{ needs.spec.outputs.catalog_sha }}
        run: |
          gh release create "v$VERSION" --repo IGVF-DACC/igvf-catalog-client-openapi-spec \
            --target main --title "v$VERSION" \
            --notes "Generated from igvf-catalog $RELEASE_TAG (IGVF-DACC/igvf-catalog@$SHA)" \
            ../spec/openapi_spec.json ../spec/openapi_spec_processed.json

  # Release only: re-pin igvf-catalog-mcp to the new async client, version it
  # like the catalog and release it (its release_to_pypi.yml publishes it).
  mcp:
    needs: [spec, clients]
    if: needs.spec.outputs.changed == 'true' && (github.event.action == 'catalog-release' || inputs.channel == 'release')
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.spec.outputs.version }}
      SHA: ${{ needs.spec.outputs.catalog_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools

      - uses: actions/download-artifact@v4
        with:
          name: async-client-wheel
          path: wheel

      - name: Set up builder bot
        id: bot
        if: env.DRY_RUN != 'true'
        uses: ./tools/.github/actions/setup-bot
        with:
          app-id: ${{ vars.CATALOG_CLIENT_BUILDER_APP_ID }}
          private-key: ${{ secrets.CATALOG_CLIENT_BUILDER_PRIVATE_KEY }}
          repositories: igvf-catalog-mcp

      - name: Clone igvf-catalog-mcp@main and bump to ${{ needs.spec.outputs.version }}
        run: |
          git clone https://github.com/IGVF-DACC/igvf-catalog-mcp.git mcp
          python3 tools/scripts/bump_mcp.py --repo-dir mcp --version "$V"
          git -C mcp diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test
        working-directory: mcp
        run: |
          python -m pip install ../wheel/*.whl
          python -m pip install -e '.[dev]'
          ruff check
          pytest

      - name: Wait for igvf-catalog-async-client ${{ needs.spec.outputs.version }} on PyPI
        if: env.DRY_RUN != 'true'
        run: |
          for _ in $(seq 40); do
            if curl -sf "https://pypi.org/pypi/igvf-catalog-async-client/$V/json" > /dev/null; then
              echo "igvf-catalog-async-client $V is on PyPI"
              exit 0
            fi
            sleep 30
          done
          echo "::error::igvf-catalog-async-client $V did not appear on PyPI within 20 minutes; check its release_to_pypi run"
          exit 1

      - name: Push main and dev
        if: env.DRY_RUN != 'true'
        working-directory: mcp
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          git commit -am "release $V (igvf-catalog ${SHA:0:8})"
          git push origin HEAD:main
          if git ls-remote --exit-code --heads origin dev > /dev/null; then
            git checkout -b dev origin/dev
            python3 ../tools/scripts/bump_mcp.py --repo-dir . --version "$V"
            if git diff --quiet; then
              echo "dev already pins $V"
            else
              git commit -am "pin igvf-catalog-async-client==$V"
            fi
          else
            echo "origin/dev doesn't exist yet; creating it from main"
          fi
          git push origin HEAD:dev

      - name: Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh release create "v$V" --repo IGVF-DACC/igvf-catalog-mcp --target main --title "v$V" \
            --notes "Pinned to igvf-catalog-async-client==$V, generated from igvf-catalog $RELEASE_TAG (IGVF-DACC/igvf-catalog@$SHA)"
